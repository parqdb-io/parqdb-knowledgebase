[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "parqdb-knowledgebase"
version = "0.1.0.dev0"
description = "Build a serverless vector-search knowledge base with ParqDB"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = [
  "markdown-it-py>=4,<5",
  "parqdb[publish]>=0.2.0rc1,<0.3",
  "pyarrow>=18",
  "transformers>=4.45,<5",
]

[project.scripts]
parqdb-kb = "parqdb_knowledgebase.cli:main"

[project.urls]
Repository = "https://github.com/parqdb-io/parqdb-knowledgebase"
Issues = "https://github.com/parqdb-io/parqdb-knowledgebase/issues"

[dependency-groups]
dev = ["pyright>=1.1.400,<2", "pytest>=8.3,<9", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/parqdb_knowledgebase"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PYI", "RUF", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

